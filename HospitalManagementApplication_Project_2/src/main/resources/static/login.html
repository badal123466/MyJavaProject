
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>City Care Hospital - Login</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   DEEP BLUE + PURPLE BODY
========================= */

body {

    font-family: Arial, sans-serif;

    min-height: 100vh;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(70, 0, 180, 0.45),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 75%,
            rgba(25, 0, 120, 0.55),
            transparent 35%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(40, 0, 160, 0.35),
            transparent 45%
        ),

        linear-gradient(
            135deg,
            #00001f 0%,
            #000b3d 20%,
            #00145c 40%,
            #10005c 60%,
            #26006b 80%,
            #09002d 100%
        );
}


/* =========================
   BACKGROUND
========================= */

.background {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    z-index: 0;

    pointer-events: none;
}


/* =========================
   SLOW RAIN
========================= */

.rain {

    position: absolute;

    top: -150px;

    width: 2px;

    height: 100px;

    background:

        linear-gradient(
            transparent,
            rgba(180, 170, 255, 0.65),
            rgba(110, 80, 255, 0.45)
        );

    opacity: 0.35;

    box-shadow:
        0 0 6px rgba(90, 50, 255, 0.45);

    animation:

        rainFall
        7s
        linear
        infinite;
}


@keyframes rainFall {

    0% {

        transform:
            translateY(-150px)
            rotate(8deg);

        opacity: 0;

    }

    20% {

        opacity: 0.35;

    }

    80% {

        opacity: 0.35;

    }

    100% {

        transform:
            translateY(110vh)
            rotate(8deg);

        opacity: 0;

    }
}


/* Rain positions */

.rain:nth-child(5) {
    left: 3%;
    animation-duration: 7s;
}

.rain:nth-child(6) {
    left: 12%;
    animation-duration: 8s;
    animation-delay: 1s;
}

.rain:nth-child(7) {
    left: 21%;
    animation-duration: 6.5s;
    animation-delay: 2s;
}

.rain:nth-child(8) {
    left: 30%;
    animation-duration: 8s;
    animation-delay: .5s;
}

.rain:nth-child(9) {
    left: 39%;
    animation-duration: 7.5s;
    animation-delay: 2s;
}

.rain:nth-child(10) {
    left: 48%;
    animation-duration: 8.5s;
    animation-delay: 1s;
}

.rain:nth-child(11) {
    left: 57%;
    animation-duration: 7s;
    animation-delay: 2.5s;
}

.rain:nth-child(12) {
    left: 66%;
    animation-duration: 8s;
    animation-delay: 1.5s;
}

.rain:nth-child(13) {
    left: 75%;
    animation-duration: 6.5s;
    animation-delay: 3s;
}

.rain:nth-child(14) {
    left: 84%;
    animation-duration: 8.5s;
    animation-delay: 2s;
}

.rain:nth-child(15) {
    left: 93%;
    animation-duration: 7s;
    animation-delay: 1s;
}


/* =========================
   PURPLE LIGHT LINES
========================= */

.fast-line {

    position: absolute;

    width: 2px;

    height: 80px;

    background:

        linear-gradient(
            transparent,
            rgba(180, 150, 255, 0.65),
            rgba(100, 50, 255, 0.7)
        );

    opacity: 0.30;

    box-shadow:
        0 0 8px rgba(120, 60, 255, 0.45);

    animation:
        lineMove
        7s
        linear
        infinite;
}


@keyframes lineMove {

    0% {

        top: -100px;

        opacity: 0;

    }

    20% {

        opacity: 0.30;

    }

    80% {

        opacity: 0.30;

    }

    100% {

        top: 110vh;

        opacity: 0;

    }
}


.fast-line:nth-child(16) {
    left: 5%;
    animation-delay: 0s;
}

.fast-line:nth-child(17) {
    left: 13%;
    animation-delay: 1.5s;
}

.fast-line:nth-child(18) {
    left: 21%;
    animation-delay: 3s;
}

.fast-line:nth-child(19) {
    left: 29%;
    animation-delay: .5s;
}

.fast-line:nth-child(20) {
    left: 37%;
    animation-delay: 2s;
}

.fast-line:nth-child(21) {
    left: 45%;
    animation-delay: 3.5s;
}

.fast-line:nth-child(22) {
    left: 53%;
    animation-delay: 1s;
}

.fast-line:nth-child(23) {
    left: 61%;
    animation-delay: 2.5s;
}

.fast-line:nth-child(24) {
    left: 69%;
    animation-delay: 4s;
}

.fast-line:nth-child(25) {
    left: 77%;
    animation-delay: 1.5s;
}

.fast-line:nth-child(26) {
    left: 85%;
    animation-delay: 3s;
}

.fast-line:nth-child(27) {
    left: 93%;
    animation-delay: 2s;
}


/* =========================
   DEEP PURPLE / BLUE BALLOONS
========================= */

.balloon {

    position: absolute;

    width: 78px;

    height: 98px;

    border-radius:
        50% 50% 45% 45%;

    opacity: 0.90;

    box-shadow:

        inset -18px -12px 22px
        rgba(0,0,0,0.45),

        inset 12px 10px 20px
        rgba(255,255,255,0.18),

        0 0 30px
        rgba(90,50,255,0.50);

    animation:
        balloonMove
        34s
        linear
        infinite;

    z-index: 1;
}


/* Balloon shine */

.balloon::after {

    content: "";

    position: absolute;

    width: 18px;

    height: 32px;

    top: 15px;

    left: 16px;

    background:
        rgba(255,255,255,0.38);

    border-radius: 50%;

    transform:
        rotate(-25deg);

    filter: blur(2px);
}


/* Balloon knot */

.balloon::before {

    content: "";

    position: absolute;

    width: 14px;

    height: 14px;

    bottom: -7px;

    left: 32px;

    background: inherit;

    transform:
        rotate(45deg);

    border-radius: 3px;
}


/* Balloon string */

.balloon .string {

    position: absolute;

    width: 1px;

    height: 150px;

    left: 39px;

    top: 94px;

    background:
        rgba(190,180,255,0.45);
}


/* =========================
   DEEP PURPLE BALLOON
========================= */

.balloon1 {

    left: 4%;

    bottom: -190px;

    background:

        radial-gradient(
            circle at 30% 25%,
            #d7aaff,
            #8a2be2 35%,
            #4b0082 70%,
            #18002e 100%
        );

    animation-duration: 34s;

    box-shadow:

        0 0 35px
        rgba(138,43,226,0.65),

        inset -18px -12px 22px
        rgba(0,0,0,0.45);
}


/* =========================
   DARK BLUE BALLOON
========================= */

.balloon2 {

    left: 25%;

    bottom: -230px;

    width: 70px;

    height: 90px;

    background:

        radial-gradient(
            circle at 30% 25%,
            #8aa8ff,
            #1747d1 35%,
            #001a70 70%,
            #00072d 100%
        );

    animation-duration: 38s;

    animation-delay: 4s;

    box-shadow:

        0 0 35px
        rgba(40,80,255,0.60),

        inset -18px -12px 22px
        rgba(0,0,0,0.45);
}


/* =========================
   DEEP VIOLET BALLOON
========================= */

.balloon3 {

    left: 68%;

    bottom: -210px;

    background:

        radial-gradient(
            circle at 30% 25%,
            #e0b5ff,
            #7200ff 35%,
            #350078 70%,
            #12002a 100%
        );

    animation-duration: 36s;

    animation-delay: 3s;

    box-shadow:

        0 0 35px
        rgba(114,0,255,0.70),

        inset -18px -12px 22px
        rgba(0,0,0,0.45);
}


/* =========================
   DEEP NAVY BLUE BALLOON
========================= */

.balloon4 {

    left: 88%;

    bottom: -240px;

    width: 73px;

    height: 94px;

    background:

        radial-gradient(
            circle at 30% 25%,
            #9aafff,
            #304dcc 35%,
            #06185c 70%,
            #00051f 100%
        );

    animation-duration: 40s;

    animation-delay: 6s;

    box-shadow:

        0 0 35px
        rgba(45,70,220,0.60),

        inset -18px -12px 22px
        rgba(0,0,0,0.50);
}


/* =========================
   BALLOON MOVEMENT
========================= */

@keyframes balloonMove {

    0% {

        transform:
            translateY(0)
            translateX(0)
            rotate(-5deg);

    }

    20% {

        transform:
            translateY(-25vh)
            translateX(35px)
            rotate(6deg);

    }

    40% {

        transform:
            translateY(-45vh)
            translateX(-30px)
            rotate(-6deg);

    }

    60% {

        transform:
            translateY(-65vh)
            translateX(30px)
            rotate(6deg);

    }

    80% {

        transform:
            translateY(-90vh)
            translateX(-25px)
            rotate(-6deg);

    }

    100% {

        transform:
            translateY(-125vh)
            translateX(20px)
            rotate(5deg);

    }
}


/* =========================
   HEART LOGO
========================= */

.logo-heart {

    width: 105px;

    height: 105px;

    margin:
        0 auto 15px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    animation:
        heartFloat
        3s
        ease-in-out
        infinite;
}


.heart {

    width: 62px;

    height: 62px;

    position: relative;

    background:

        linear-gradient(
            135deg,
            #ff1744,
            #b00035,
            #5c0022
        );

    transform:
        rotate(-45deg);

    border-radius: 10px;

    box-shadow:

        0 0 18px
        rgba(255,0,70,0.85),

        0 0 40px
        rgba(180,0,70,0.60);

    animation:
        heartBeat
        1.5s
        ease-in-out
        infinite;
}


.heart::before,
.heart::after {

    content: "";

    position: absolute;

    width: 62px;

    height: 62px;

    background:

        linear-gradient(
            135deg,
            #ff1744,
            #b00035,
            #5c0022
        );

    border-radius: 50%;
}


.heart::before {

    top: -31px;

    left: 0;
}


.heart::after {

    left: 31px;

    top: 0;
}


/* Heart shine */

.heart-shine {

    position: absolute;

    width: 16px;

    height: 26px;

    background:
        rgba(255,255,255,0.65);

    border-radius: 50%;

    transform:
        rotate(-45deg);

    top: 21px;

    left: 34px;

    z-index: 5;

    filter: blur(1px);
}


/* Heart float */

@keyframes heartFloat {

    0%,
    100% {

        transform:
            translateY(0)
            scale(1);

    }

    50% {

        transform:
            translateY(-10px)
            scale(1.05);

    }
}


/* Heart beat */

@keyframes heartBeat {

    0%,
    100% {

        transform:
            rotate(-45deg)
            scale(1);

    }

    25% {

        transform:
            rotate(-45deg)
            scale(1.12);

    }

    40% {

        transform:
            rotate(-45deg)
            scale(1);

    }

    60% {

        transform:
            rotate(-45deg)
            scale(1.08);

    }
}


/* =========================
   LOGIN CONTAINER
========================= */

.login-container {

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    position: relative;

    z-index: 10;
}


/* =========================
   LOGIN CARD
========================= */

.login-card {

    width: 420px;

    padding:
        40px 42px 45px;

    background:
        rgba(255,255,255,0.94);

    border:
        1px solid rgba(255,255,255,0.95);

    border-radius: 25px;

    text-align: center;

    box-shadow:

        0 20px 60px
        rgba(0,0,0,0.55),

        0 0 40px
        rgba(80,40,255,0.35),

        0 0 80px
        rgba(40,0,150,0.30);

    backdrop-filter:
        blur(18px);

    position: relative;

    overflow: hidden;

    animation:
        cardAppear
        1.2s
        ease;
}


/* Top purple-blue line */

.login-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 5px;

    background:

        linear-gradient(
            90deg,
            #000d66,
            #172bb8,
            #5b00c9,
            #8a2be2,
            #000d66
        );

    background-size: 300% 100%;

    animation:
        topLine
        4s
        linear
        infinite;
}


@keyframes topLine {

    0% {
        background-position: 0%;
    }

    100% {
        background-position: 300%;
    }
}


/* Card animation */

@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.95);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }
}


/* =========================
   TITLE
========================= */

.login-card h1 {

    color:
        #101b66;

    font-size: 28px;

    margin-bottom: 8px;

    font-weight: 700;
}


.login-card > p {

    color:
        #50556d;

    font-size: 15px;

    margin-bottom: 30px;
}


/* =========================
   FORM
========================= */

#loginForm {

    text-align: left;
}


#loginForm label {

    display: block;

    color:
        #20264d;

    font-weight: bold;

    margin-bottom: 7px;
}


#loginForm input {

    width: 100%;

    padding: 14px;

    margin-bottom: 20px;

    border:
        1px solid #c7c9dc;

    border-radius: 10px;

    font-size: 15px;

    outline: none;

    background:
        rgba(255,255,255,.95);

    transition:
        .3s;
}


#loginForm input:focus {

    border-color:
        #4b20c9;

    background:
        white;

    box-shadow:
        0 0 12px
        rgba(75,32,201,.35);
}


/* =========================
   LOGIN BUTTON
========================= */

#loginForm button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background:

        linear-gradient(
            135deg,
            #000b5c,
            #1027a8,
            #4b00a8,
            #7200c9,
            #16005c
        );

    background-size:
        250% 250%;

    color:
        white;

    font-size: 17px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:

        0 8px 25px
        rgba(50,20,180,.50);

    transition:
        transform .3s,
        box-shadow .3s;

    animation:
        buttonGlow
        4s
        ease
        infinite;
}


@keyframes buttonGlow {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


#loginForm button:hover {

    transform:
        translateY(-3px);

    box-shadow:

        0 12px 35px
        rgba(80,40,220,.70);
}


#loginForm button:active {

    transform:
        translateY(0);
}


/* =========================
   ERROR
========================= */

#errorMessage {

    color:
        #d51c45;

    text-align:
        center;

    margin-top:
        15px;

    font-size:
        14px;
}


/* =========================
   MOVING PURPLE GLOW
========================= */

.background::after {

    content: "";

    position: absolute;

    width: 550px;

    height: 550px;

    border-radius: 50%;

    background:
        rgba(80,20,255,0.12);

    filter:
        blur(100px);

    top: 5%;

    left: 30%;

    animation:
        purpleGlow
        10s
        ease-in-out
        infinite alternate;
}


@keyframes purpleGlow {

    from {

        transform:
            translateX(-160px)
            translateY(0);

    }

    to {

        transform:
            translateX(160px)
            translateY(120px);

    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .login-card {

        width: 100%;

        padding:
            35px 22px;
    }

    .login-card h1 {

        font-size:
            23px;
    }

    .logo-heart {

        transform:
            scale(.85);
    }

    .balloon {

        transform:
            scale(.75);
    }
}

</style>

</head>


<body>


<!-- =========================
     ANIMATED BACKGROUND
========================= -->

<div class="background">


    <!-- BALLOONS -->

    <div class="balloon balloon1">
        <div class="string"></div>
    </div>

    <div class="balloon balloon2">
        <div class="string"></div>
    </div>

    <div class="balloon balloon3">
        <div class="string"></div>
    </div>

    <div class="balloon balloon4">
        <div class="string"></div>
    </div>


    <!-- SLOW RAIN -->

    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>
    <div class="rain"></div>


    <!-- PURPLE LINES -->

    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>
    <div class="fast-line"></div>

</div>


<!-- =========================
     LOGIN
========================= -->

<div class="login-container">

    <div class="login-card">


        <!-- LOVE HEART LOGO -->

        <div class="logo-heart">

            <div class="heart">

                <div class="heart-shine"></div>

            </div>

        </div>


        <h1>
            City Care Hospital
        </h1>


        <p>
            Hospital Management System
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <label for="username">
                Username
            </label>


            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button type="submit">
                Login
            </button>


            <p id="errorMessage"></p>


        </form>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const errorMessage =
        document
        .getElementById("errorMessage");


    /*
       DEMO LOGIN

       Username: admin
       Password: admin123
    */


    if (
        username === "admin" &&
        password === "admin123"
    ) {

        errorMessage.textContent = "";

        alert("Login Successful!");

        window.location.href =
            "dashboard.html";

    } else {

        errorMessage.textContent =
            "Invalid username or password!";

    }

});

</script>


</body>

</html>
