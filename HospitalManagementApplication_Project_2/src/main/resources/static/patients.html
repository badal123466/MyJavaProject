
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patients - City Care Hospital</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #0b1d2e,
                    #102a43,
                    #07111f
                );

            overflow-x: hidden;
        }


        /* ===============================
           ANIMATED BACKGROUND
        =============================== */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            z-index: -1;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 180, 255, 0.15),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(100, 50, 255, 0.18),
                    transparent 25%
                );
        }


        .orb {

            position: absolute;

            border-radius: 50%;

            filter: blur(5px);

            opacity: 0.45;

            animation:
                floatingOrb 12s ease-in-out infinite;
        }


        .orb1 {

            width: 250px;
            height: 250px;

            background:
                radial-gradient(
                    circle,
                    #087ea4,
                    transparent 70%
                );

            top: 5%;
            left: 5%;
        }


        .orb2 {

            width: 300px;
            height: 300px;

            background:
                radial-gradient(
                    circle,
                    #4932a8,
                    transparent 70%
                );

            right: 5%;
            top: 20%;

            animation-delay: 3s;
        }


        .orb3 {

            width: 220px;
            height: 220px;

            background:
                radial-gradient(
                    circle,
                    #087b91,
                    transparent 70%
                );

            bottom: 5%;
            left: 35%;

            animation-delay: 6s;
        }


        @keyframes floatingOrb {

            0% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(50px, -40px)
                    scale(1.15);
            }

            100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }
        }


        /* ===============================
           TOPBAR
        =============================== */

        .topbar {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            background:
                rgba(5, 15, 30, 0.90);

            border-bottom:
                1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(15px);

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .topbar h2 {

            font-size: 22px;

            letter-spacing: 1px;
        }


        .topbar button {

            border: none;

            padding: 10px 22px;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #087ea4,
                    #5734b6
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .topbar button:hover {

            transform:
                translateY(-3px)
                scale(1.05);

            box-shadow:
                0 8px 25px
                rgba(50,100,255,0.35);
        }


        /* ===============================
           LAYOUT
        =============================== */

        .layout {

            display: flex;

            min-height:
                calc(100vh - 70px);
        }


        /* ===============================
           SIDEBAR
        =============================== */

        aside {

            width: 230px;

            padding: 25px 15px;

            background:
                rgba(4,15,28,0.85);

            border-right:
                1px solid rgba(255,255,255,0.10);

            backdrop-filter: blur(15px);
        }


        aside a {

            display: block;

            text-decoration: none;

            color: #c9d3df;

            padding: 14px 16px;

            margin-bottom: 8px;

            border-radius: 10px;

            transition: 0.3s;
        }


        aside a:hover {

            color: white;

            background:
                rgba(30,130,170,0.20);

            transform:
                translateX(5px);
        }


        aside a.active {

            color: white;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,140,180,0.7),
                    rgba(90,50,170,0.7)
                );

            box-shadow:
                0 5px 20px
                rgba(50,100,200,0.25);
        }


        /* ===============================
           MAIN
        =============================== */

        main {

            flex: 1;

            padding: 35px;

            overflow-x: auto;
        }


        main h1 {

            margin-bottom: 25px;

            font-size: 32px;
        }


        /* ===============================
           PANEL
        =============================== */

        .panel {

            margin-bottom: 30px;

            padding: 25px;

            border-radius: 18px;

            background:
                rgba(8,22,38,0.78);

            border:
                1px solid rgba(255,255,255,0.12);

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.35);

            animation:
                panelAppear 0.7s ease;
        }


        @keyframes panelAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        .panel h2 {

            margin-bottom: 20px;

            font-size: 21px;
        }


        /* ===============================
           FORM
        =============================== */

        #patientForm {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        #patientForm input,
        #patientForm select {

            width: 100%;

            padding: 14px 16px;

            border-radius: 10px;

            border:
                1px solid
                rgba(120,170,200,0.35);

            outline: none;

            background:
                rgba(3,14,27,0.80);

            color: white;

            font-size: 14px;

            transition: 0.3s;
        }


        #patientForm input::placeholder {

            color: #9daab7;
        }


        #patientForm select option {

            background: #0b1b2b;

            color: white;
        }


        #patientForm input:focus,
        #patientForm select:focus {

            border-color: #22b8e6;

            box-shadow:
                0 0 15px
                rgba(0,190,230,0.25);

            transform:
                translateY(-3px);
        }


        /* ===============================
           REGISTER BUTTON
        =============================== */

        #patientForm button {

            grid-column: 1 / -1;

            padding: 14px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #087ea4,
                    #4d36a5,
                    #087ea4
                );

            background-size: 200% 100%;

            animation:
                buttonAnimation 4s linear infinite;
        }


        @keyframes buttonAnimation {

            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }


        /* ===============================
           TABLE
        =============================== */

        .table-container {

            width: 100%;

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 1100px;
        }


        th {

            padding: 14px;

            text-align: left;

            white-space: nowrap;

            background:
                linear-gradient(
                    90deg,
                    #0b526c,
                    #49327c
                );

            color: white;
        }


        td {

            padding: 13px;

            color: #d3dce5;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            white-space: nowrap;
        }


        tbody tr {

            transition: 0.3s;
        }


        tbody tr:hover {

            background:
                rgba(40,130,170,0.12);
        }


        /* ===============================
           DELETE BUTTON
        =============================== */

        .delete-btn {

            border: none;

            padding: 7px 12px;

            border-radius: 7px;

            background: #b52b45;

            color: white;

            cursor: pointer;

            transition: 0.3s;
        }


        .delete-btn:hover {

            background: #e13d5c;

            transform:
                scale(1.05);
        }


        /* ===============================
           RESPONSIVE
        =============================== */

        @media (max-width: 900px) {

            aside {
                width: 190px;
            }

            main {
                padding: 25px;
            }

            #patientForm {
                grid-template-columns: 1fr;
            }
        }


        @media (max-width: 650px) {

            .topbar {
                padding: 0 15px;
            }

            .topbar h2 {
                font-size: 17px;
            }

            .layout {
                display: block;
            }

            aside {

                width: 100%;

                display: flex;

                overflow-x: auto;

                padding: 10px;

                position: sticky;

                top: 70px;
            }

            aside a {

                min-width:
                    max-content;

                margin:
                    0 5px;
            }

            main {

                padding:
                    20px 15px;
            }

            main h1 {

                font-size: 25px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="background">

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

</div>


<!-- =====================================================
     TOPBAR
===================================================== -->

<header class="topbar">

    <h2>
        🏥 City Care Hospital
    </h2>

    <button
        type="button"
        onclick="logout()">

        Logout

    </button>

</header>


<!-- =====================================================
     LAYOUT
===================================================== -->

<div class="layout">


    <!-- SIDEBAR -->

    <aside>

        <a href="dashboard.html">
            🏠 Dashboard
        </a>

        <a href="patients.html"
           class="active">
            👨‍⚕️ Patients
        </a>

        <a href="doctors.html">
            🩺 Doctors
        </a>

        <a href="departments.html">
            🏥 Departments
        </a>

        <a href="appointments.html">
            📅 Appointments
        </a>

        <a href="billing.html">
            💳 Billing
        </a>

    </aside>


    <!-- MAIN -->

    <main>

        <h1>
            Patient Management
        </h1>


        <!-- =========================================
             REGISTRATION
        ========================================== -->

        <div class="panel">

            <h2>
                📝 Patient Registration
            </h2>


            <form id="patientForm">


                <input
                    type="text"
                    id="name"
                    placeholder="Patient Name"
                    required
                >


                <input
                    type="number"
                    id="age"
                    placeholder="Age"
                    min="1"
                    max="120"
                    required
                >


                <select
                    id="gender"
                    required
                >

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <input
                    type="text"
                    id="phone"
                    placeholder="Phone Number"
                    required
                >


                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                >


                <input
                    type="text"
                    id="bloodGroup"
                    placeholder="Blood Group"
                >


                <input
                    type="text"
                    id="address"
                    placeholder="Address"
                >


                <button type="submit">

                    Register Patient

                </button>


            </form>

        </div>


        <!-- =========================================
             PATIENT LIST
        ========================================== -->

        <div class="panel">

            <h2>
                📋 Patient List
            </h2>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Patient Code</th>

                            <th>Name</th>

                            <th>Age</th>

                            <th>Gender</th>

                            <th>Phone</th>

                            <th>Email</th>

                            <th>Blood Group</th>

                            <th>Address</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="patientTable">

                        <tr>

                            <td colspan="10"
                                style="text-align:center;">

                                Loading patients...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script src="js/patients.js"></script>


<script>

function logout() {

    if (
        confirm(
            "Are you sure you want to logout?"
        )
    ) {

        window.location.href =
            "login.html";
    }

}

</script>


</body>

</html>
