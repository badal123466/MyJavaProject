<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Billing - City Care Hospital</title>

<link rel="stylesheet"
      href="css/style.css">


</head>

<body>

<header class="topbar">


<h2>🏥 City Care Hospital</h2>

<button onclick="logout()">
    Logout
</button>


</header>

<div class="layout">


<aside>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="patients.html">
        Patients
    </a>

    <a href="doctors.html">
        Doctors
    </a>

    <a href="departments.html">
        Departments
    </a>

    <a href="appointments.html">
        Appointments
    </a>

    <a href="billing.html">
        Billing
    </a>

</aside>


<main>

    <h1>Billing Management</h1>


    <div class="panel">

        <h2>Create Invoice</h2>

        <form id="invoiceForm">


            <select
                id="patientId"
                required>

                <option value="">
                    Select Patient
                </option>

            </select>


            <input
                id="consultationCharge"
                type="number"
                step="0.01"
                placeholder="Consultation Charge"
                value="0">


            <input
                id="medicineCharge"
                type="number"
                step="0.01"
                placeholder="Medicine Charge"
                value="0">


            <input
                id="labCharge"
                type="number"
                step="0.01"
                placeholder="Lab Charge"
                value="0">


            <input
                id="roomCharge"
                type="number"
                step="0.01"
                placeholder="Room Charge"
                value="0">


            <button type="submit">
                Create Invoice
            </button>

        </form>

    </div>


    <div class="panel">

        <h2>Invoice List</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Invoice Number</th>
                <th>Patient</th>
                <th>Consultation</th>
                <th>Medicine</th>
                <th>Lab</th>
                <th>Room</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Status</th>
                <th>Date</th>

            </tr>

            </thead>

            <tbody id="invoiceTable">

            </tbody>

        </table>

    </div>

</main>

</div>




<script src="js/billing.js"></script>
</body>
</html>
